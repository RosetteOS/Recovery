name: Build RosetteOS Recovery & OTA Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'RosetteOS release tag to fetch (leave blank for latest published)'
        required: false
        default: ''
      ota_version:
        description: 'Package version for Creality stock updater'
        required: false
        default: '1.1.0.34'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out package template
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Resolve RosetteOS release
        id: resolve_release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT

          if [ -n "$REQUESTED_TAG" ]; then
            echo "Fetching specified RosetteOS release tag: $REQUESTED_TAG"
            api_url="https://api.github.com/repos/RosetteOS/RosetteOS/releases/tags/${REQUESTED_TAG}"
          else
            echo "Fetching latest published RosetteOS release..."
            api_url="https://api.github.com/repos/RosetteOS/RosetteOS/releases?per_page=100"
          fi

          curl --fail --location --retry 3 --retry-delay 2 --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url" \
            --output "$release_json"

          python3 - << 'EOF' "$release_json"
          import sys, json, os, re

          json_file = sys.argv[1]
          with open(json_file, "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, list):
              published = [r for r in data if not r.get("draft") and r.get("published_at")]
              if not published:
                  print("::error::RosetteOS has no published releases. Create a release containing xImage and rootfs.squashfs first.", file=sys.stderr)
                  sys.exit(1)
              published.sort(key=lambda r: r.get("published_at", ""))
              release = published[-1]
          elif isinstance(data, dict):
              if data.get("message") == "Not Found":
                  print("::error::Specified RosetteOS release tag not found.", file=sys.stderr)
                  sys.exit(1)
              release = data
          else:
              print("::error::Unexpected API response format.", file=sys.stderr)
              sys.exit(1)

          tag_name = release.get("tag_name")
          if not tag_name:
              print("::error::Release object missing tag_name.", file=sys.stderr)
              sys.exit(1)

          assets = {a["name"]: a["browser_download_url"] for a in release.get("assets", []) if "name" in a and "browser_download_url" in a}
          root2_url = assets.get("rootfs.squashfs")
          kernel2_url = assets.get("xImage")

          if not root2_url or not kernel2_url:
              print(f"::error::Release '{tag_name}' does not contain both required assets (rootfs.squashfs and xImage).", file=sys.stderr)
              sys.exit(1)

          safe_tag = re.sub(r"[^A-Za-z0-9._-]", "-", tag_name)
          ingenic_package = f"Ender-3_V3_KE_1.1.0.12-{safe_tag}.ingenic"

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as out:
                  out.write(f"release_tag={tag_name}\n")
                  out.write(f"root2_url={root2_url}\n")
                  out.write(f"kernel2_url={kernel2_url}\n")
                  out.write(f"ingenic_package={ingenic_package}\n")

          print(f"Using RosetteOS release: {tag_name}")
          print(f"Ingenic package: {ingenic_package}")
          EOF

      - name: Download RosetteOS kernel and rootfs
        env:
          ROOT2_URL: ${{ steps.resolve_release.outputs.root2_url }}
          KERNEL2_URL: ${{ steps.resolve_release.outputs.kernel2_url }}
        run: |
          set -euo pipefail
          mkdir -p build_tmp dist
          curl --fail --location --retry 3 --retry-delay 2 --show-error \
            "$ROOT2_URL" --output build_tmp/rootfs.squashfs
          curl --fail --location --retry 3 --retry-delay 2 --show-error \
            "$KERNEL2_URL" --output build_tmp/xImage
          test -s build_tmp/rootfs.squashfs
          test -s build_tmp/xImage

      - name: Rebuild Ingenic cloner package (Slot 1)
        run: |
          set -euo pipefail
          python3 scripts/rebuild_ingenic.py \
            Ender-3_V3_KE_1.1.0.12.ingenic \
            "dist/${{ steps.resolve_release.outputs.ingenic_package }}" \
            --root1 build_tmp/rootfs.squashfs \
            --kernel1 build_tmp/xImage

      - name: Install OTA packager dependencies
        run: |
          set -euo pipefail
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)

      - name: Build Stock CrealityOS OTA packages (Ender-3 V3 KE & Nebula Pad)
        env:
          OTA_VERSION: ${{ github.event.inputs.ota_version || '1.1.0.34' }}
        run: |
          set -euo pipefail
          echo "== Building Ender-3 V3 KE stock OTA package =="
          python3 tools/pack_rosetteos.py \
            --target ke \
            --ximage build_tmp/xImage \
            --rootfs build_tmp/rootfs.squashfs \
            --zero-bin assets/zero.bin \
            --version "$OTA_VERSION" \
            --output "dist/Ender-3_V3_KE_F005_ota_img_V${OTA_VERSION}.img"

          echo "== Building Creality Nebula Pad stock OTA package =="
          python3 tools/pack_rosetteos.py \
            --target nebula \
            --ximage build_tmp/xImage \
            --rootfs build_tmp/rootfs.squashfs \
            --zero-bin assets/zero_nebula.bin \
            --version "$OTA_VERSION" \
            --output "dist/NEBULA_ota_img_V${OTA_VERSION}.img"

          echo "== Generated packages in dist/ =="
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rosetteos-recovery-and-ota-packages
          path: dist/*
          if-no-files-found: error

      - name: Publish packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve_release.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_title="RosetteOS Recovery & OTA Packages ${RELEASE_TAG}"
          files=(dist/*)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$release_title"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "$release_title" \
              --notes "Ingenic cloner (Slot 1) and stock CrealityOS USB OTA packages for RosetteOS ${RELEASE_TAG}."
          fi
